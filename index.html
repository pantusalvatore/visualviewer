<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Visual Viewer</title>
  <meta name="description" content="Visualizzatore audio reattivo per brani AIF e MP3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing">
  <canvas id="stage"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <section id="landing">
    <div class="card">
      <h1>visual<span>viewer</span></h1>
      <p class="sub">Trascina qui un brano <b>.aif</b> / <b>.aiff</b> o <b>.mp3</b>:<br>frequenze, ritmo e timbro diventano luce in tempo reale.</p>
      <label class="btn primary">
        Scegli un file
        <input type="file" id="file" accept=".aif,.aiff,.aifc,.mp3,.wav,.flac,.ogg,.m4a,audio/*" hidden>
      </label>
      <p class="hint">Il file resta sul tuo computer: nessun upload.</p>
    </div>
  </section>

  <div id="dropOverlay" aria-hidden="true"><span>Rilascia il brano</span></div>
  <div id="loading" hidden><i></i><span>Decodifica in corso…</span></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <aside id="hud">
    <div class="track" id="trackName"></div>
    <div class="bpm"><span id="bpm">—</span> BPM <i id="beatDot"></i></div>
    <div class="meters" id="meters"></div>
    <div class="centroid">Centroide <span id="centroidHz">—</span></div>
  </aside>

  <footer id="controls" hidden>
    <div class="row">
      <button id="playBtn" class="icon" title="Play / pausa (Spazio)" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
      </button>
      <span class="time" id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Posizione">
      <span class="time" id="dur">0:00</span>
    </div>
    <div class="row tools">
      <div class="scenes" id="scenes"></div>
      <button id="autoBtn" class="chip" title="Cambia scena da sola a tempo di musica (A)">Auto</button>
      <select id="palette" aria-label="Palette" title="Palette (P)"></select>
      <label class="sens" title="Quanto il visual reagisce al suono">
        <span>Sensibilità</span>
        <input type="range" id="sens" min="0" max="100" value="55">
      </label>
      <div class="spacer"></div>
      <button id="hudBtn" class="icon" title="Mostra analisi (H)" aria-label="Analisi">
        <svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z"/></svg>
      </button>
      <select id="recFormat" class="rec-format" aria-label="Formato video" title="Formato del video registrato"></select>
      <button id="recBtn" class="icon" title="Registra video (R)" aria-label="Registra">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></svg>
      </button>
      <label class="icon" title="Apri un altro brano (O)" aria-label="Apri brano">
        <svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h5l2 2h8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
        <input type="file" id="file2" accept=".aif,.aiff,.aifc,.mp3,.wav,.flac,.ogg,.m4a,audio/*" hidden>
      </label>
      <button id="fsBtn" class="icon" title="Schermo intero (F)" aria-label="Schermo intero">
        <svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>
      </button>
    </div>
  </footer>

  <script src="js/aiff.js"></script>
  <script src="js/player.js"></script>
  <script src="js/features.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
